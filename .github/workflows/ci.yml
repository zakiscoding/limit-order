name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: ubuntu-${{ matrix.os }} ${{ matrix.cxx }}
    runs-on: ubuntu-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["22.04", "24.04"]
        cxx: [g++, clang++]
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang
      - name: Compiler versions
        run: |
          "$CXX" --version
          cmake --version
      - name: Build and test
        run: bash scripts/test.sh --bench-smoke --net

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-24.04
    env:
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
      - name: Build and test with sanitizers
        run: bash scripts/test.sh --sanitize --net
